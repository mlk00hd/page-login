
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Démo de connexion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .page {
            width: 100%;
            max-width: 400px;
            margin: 70px auto;
            padding: 30px 25px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
        }

        .field {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            height: 48px;
            padding: 12px;
            padding-right: 48px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #555;
            padding: 5px;
        }

        .toggle-password svg {
            width: 21px;
            height: 21px;
        }

        .demo-button {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 5px;
            background: #555;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <main class="page">

        <h2>Démo de connexion</h2>

        <div class="field">
            <input
                type="text"
                placeholder="Identifiant fictif"
                autocomplete="off"
            >
        </div>

        <div class="field">

            <input
                type="password"
                id="password"
                placeholder="Mot de passe de démonstration"
                autocomplete="off"
            >

            <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Afficher le mot de passe"
                aria-pressed="false">

                <svg id="eyeIcon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>

                </svg>
            </button>

        </div>

        <button type="button" class="demo-button">
            Démonstration
        </button>

        <p class="note">
            Maquette locale : aucune donnée n'est envoyée.
        </p>

    </main>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        toggle.addEventListener("click", () => {

            const isHidden = password.type === "password";

            password.type = isHidden ? "text" : "password";

            if (isHidden) {
                eyeIcon.innerHTML = `
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3 3.8"/>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/>
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            }

            toggle.setAttribute("aria-pressed", isHidden);
            toggle.setAttribute(
                "aria-label",
                isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe"
            );
        });
    </script>

</body>
</html>
