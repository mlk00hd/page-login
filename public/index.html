
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TP Cybersécurité – Maquette de connexion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">

        <div class="language">
            Français (France) ﹀
        </div>

        <div class="logo"
             role="img"
             aria-label="Logo de démonstration"></div>

      

        <form class="login-form"
              id="login-form"
              novalidate>

            <label class="visually-hidden" for="contact">
                Adresse Gmail ou numéro de téléphone
            </label>

            <input
                type="text"
                id="contact"
                name="contact"
                inputmode="text"
                autocomplete="off"
                maxlength="254"
                placeholder="Adresse Gmail ou numéro de téléphone"
                aria-label="Adresse e-mail ou numéro fictif"
                required
            >

            <label class="visually-hidden" for="username">
                Nom d'utilisateur
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="off"
                maxlength="50"
                placeholder="Nom d'utilisateur"
                aria-label="Nom d'utilisateur fictif"
                required
            >

            <button
                type="submit"
                class="login-button"
                id="submit">
                Se connecter
            </button>

        </form>

        <p id="message"
           role="status"
           aria-live="polite"
           hidden></p>

        <a href="#" class="forgot" id="forgotLink">
            Mot de passe oublié ?
        </a>

        <button
            type="button"
            class="create-account"
            id="createAccount">
            Créer un nouveau compte
        </button>

        <div class="meta" aria-label="Meta">
            ∞ Meta
        </div>

       
    </main>

    <script src="script.js" defer></script>
</body>
</html>
