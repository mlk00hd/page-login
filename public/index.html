<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Connexion</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1c1c1c;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 75px 4% 20px;
        }

        .language {
            color: #a8a8ad;
            font-size: 17px;
            margin-bottom: 165px;
            cursor: pointer;
        }

        .logo {
            width: 112px;
            height: 112px;
            border: 8px solid transparent;
            border-radius: 32px;
            background:
                linear-gradient(#1c1c1c, #1c1c1c) padding-box,
                linear-gradient(45deg, #ffd600, #ff7a00,
                #ff0069, #d300c5, #7638fa) border-box;
            position: relative;
            margin-bottom: 195px;
        }

        .logo::before {
            content: "";
            position: absolute;
            width: 43px;
            height: 43px;
            border: 8px solid #e1308b;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            background: #d629c8;
            border-radius: 50%;
            right: 12px;
            top: 12px;
        }

        .login-form {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .login-form input {
            width: 100%;
            height: 76px;
            background: transparent;
            border: 2px solid #494949;
            border-radius: 29px;
            color: white;
            padding: 0 30px;
            font-size: 17px;
            outline: none;
        }

        .login-form input::placeholder {
            color: #a8a8ad;
            opacity: 1;
        }

        .login-form input:focus {
            border-color: #777;
        }

        .login-button {
            width: 100%;
            height: 72px;
            border: none;
            border-radius: 40px;
            background-color: #0866e8;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            margin-top: 43px;
            color: #f5f5f5;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
        }

        .create-account {
            width: 100%;
            max-width: 500px;
            height: 72px;
            margin-top: auto;
            border: 2px solid #5599f5;
            border-radius: 40px;
            color: #5599f5;
            background: transparent;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .meta {
            margin-top: 35px;
            font-size: 26px;
            color: #eeeeee;
            letter-spacing: -1px;
        }

        @media (max-height: 850px) {
            .page {
                padding-top: 35px;
            }

            .language {
                margin-bottom: 80px;
            }

            .logo {
                margin-bottom: 90px;
            }

            .create-account {
                margin-top: 90px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <div class="language">
            Français (France) ﹀
        </div>

        <div class="logo" aria-label="Logo Instagram"></div>

        <form class="login-form" id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="Nom de profil, e-mail ou numéro de mobile"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="login-button">
                Se connecter
            </button>
        </form>

        <a href="#" class="forgot" id="forgotLink">
            Mot de passe oublié ?
        </a>

        <button class="create-account" id="createAccount">
            Créer un nouveau compte
        </button>

        <div class="meta">∞ Meta</div>

    </main>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert("Cette interface est une maquette. "
                    + "Aucune connexion réelle n'est effectuée.");
            });

        document.getElementById("forgotLink")
            .addEventListener("click", function(event) {
                event.preventDefault();
                alert("Fonction de récupération à configurer.");
            });

        document.getElementById("createAccount")
            .addEventListener("click", function() {
                alert("Page d'inscription à configurer.");
            });
    </script>
</body>
</html>
